<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Joo RP — инвентарь</title><link rel="stylesheet" href="inventory.css"></head><body>
<main class="panel"><header><div class="brand"><span class="logo">J</span> JOO <b>RP</b></div><button id="close" aria-label="Закрыть">×</button></header>
<div class="heading"><div><small>ПЕРСОНАЖ / ВЕЩИ</small><h1>Инвентарь</h1><p>Твои вещи всегда под рукой.</p></div><span class="bag">▦</span></div>
<section class="items">
  <article><span class="item-icon">◈</span><div><h2>Вода</h2><p>Восстанавливает 20 здоровья</p></div><strong id="water-count">0</strong><button data-use="water">Использовать</button></article>
  <article><span class="item-icon">◆</span><div><h2>Перекус</h2><p>Восстанавливает 15 здоровья</p></div><strong id="snack-count">0</strong><button data-use="snack">Использовать</button></article>
  <article><span class="item-icon">▣</span><div><h2>Телефон</h2><p>Контакты появятся позже</p></div><strong id="phone-count">0</strong><button data-use="phone">Открыть</button></article>
</section><footer>Новые вещи будут появляться в инвентаре по мере развития сервера. <span>ESC — закрыть</span></footer></main>
<script src="inventory.js"></script></body></html>
