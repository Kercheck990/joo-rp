<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Joo RP — вход</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true"><div class="orb orb-a"></div><div class="orb orb-b"></div><div class="grid"></div></div>
  <main class="auth">
    <aside class="story">
      <div class="brand"><span class="brand-icon">J</span><span>JOO <b>RP</b></span></div>
      <div class="story-bottom"><div class="small-label">СЕРВЕР SA-MP · ЛОС-САНТОС</div><h1>Joo RP</h1><p>Крутая игра в SA-MP.<br>Заходи, работай и катайся с друзьями.</p><div class="server-chip"><i></i> СЕРВЕР ОНЛАЙН</div></div>
    </aside>
    <section class="panel">
      <div class="panel-head"><span class="step">01 / АККАУНТ</span><span class="mark">JOO RP</span></div>
      <div class="panel-main">
        <div class="eyebrow">ДОБРО ПОЖАЛОВАТЬ</div>
        <h2 id="title">Подключаем...</h2>
        <p id="subtitle">Подождите, пока сервер проверит аккаунт.</p>
        <form id="form" autocomplete="off">
          <label for="password">Пароль</label>
          <input id="password" type="password" minlength="6" maxlength="32" pattern="[A-Za-z0-9]{6,32}" placeholder="От 6 символов" required autofocus>
          <div id="register-options" hidden>
            <label for="referral">Промокод друга <span class="optional">необязательно</span></label>
            <input id="referral" type="text" maxlength="23" pattern="[A-Za-z0-9_]{0,23}" placeholder="Ник пригласившего">
            <label>Стартовый скин</label>
            <div class="skins" role="radiogroup" aria-label="Стартовый скин">
              <label class="skin"><input type="radio" name="skin" value="78" checked><span class="skin-number">01</span><span class="silhouette">◉</span><span>Бродяга</span></label>
              <label class="skin"><input type="radio" name="skin" value="79"><span class="skin-number">02</span><span class="silhouette">◉</span><span>Уличный</span></label>
              <label class="skin"><input type="radio" name="skin" value="77"><span class="skin-number">03</span><span class="silhouette">◉</span><span>Девушка</span></label>
            </div>
          </div>
          <button id="submit" type="submit" disabled>Подождите...</button>
          <div id="error" role="alert" aria-live="polite"></div>
        </form>
      </div>
      <div class="panel-foot"><span>Нужна помощь? <b>/help</b> после входа</span><span>JOO RP © 2026</span></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
