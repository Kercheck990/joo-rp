<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="hud.css"></head>
<body><main id="hud" aria-label="Информация игрока">
  <img class="logo" src="logo-hud.png" alt="Joo RP">
  <div class="identity"><span id="online">0 игроков</span><span id="static">#0</span><span id="id">ID 0</span></div>
  <div class="meter"><span>ЗДОРОВЬЕ</span><strong id="health">100</strong><div class="track"><i id="healthbar"></i></div></div>
  <div class="meter hunger"><span>ГОЛОД</span><strong id="hunger">100</strong><div class="track"><i id="hungerbar"></i></div></div>
  <div class="bottom"><span id="weapon">Кулаки</span><b id="safe" hidden>ЗЗ · ЗЕЛЁНАЯ ЗОНА</b></div>
</main><script src="hud.js"></script></body></html>
